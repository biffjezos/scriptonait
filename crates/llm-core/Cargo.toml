[package]
name = "llm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# Deliberately zero dependencies: the tokenizer, text prep, corpus, model,
# training loop and generation compile and test with only the Rust
# standard library, so this crate never needs network or registry access
# to build or verify. Everything the project does numerically is in here,
# which is what makes `cargo test` a real gate rather than a formality.

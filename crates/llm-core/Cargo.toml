[package]
name = "llm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# `Trainer` (in train.rs) is a native, multithreaded CPU trainer with no
# caller yet: it's pre-built for the `llm-train` CLI PLAN.md describes as
# upcoming roadmap, not something the browser (which trains exclusively
# through crates/llm-gpu's GpuTrainer) or anything else in this workspace
# calls today. Off by default so it doesn't inflate the compiled surface
# of the wasm build, which never uses it; `cargo test --features
# native-trainer` still exercises it fully.
native-trainer = []

[dependencies]
# Deliberately zero dependencies: the tokenizer, text prep, corpus, model,
# training loop and generation compile and test with only the Rust
# standard library, so this crate never needs network or registry access
# to build or verify. Everything the project does numerically is in here,
# which is what makes `cargo test` a real gate rather than a formality.

# Standalone crate (deliberately not a member of the root workspace — see
# the root Cargo.toml comment): this is the only crate that gets compiled
# to wasm32, via `wasm-pack build` (see README.md at the repo root for the
# full build command). Needs network access to fetch wasm-bindgen & co,
# and the wasm32-unknown-unknown target, neither of which is available in
# every sandbox this repo might be developed in — hence keeping it out of
# the default `cargo test` workspace so that stays offline-buildable.
[workspace]

[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
llm-core = { path = "../llm-core" }
llm-gpu = { path = "../llm-gpu" }
wasm-bindgen = "0.2"
# Not called directly, but required in scope: #[wasm_bindgen]'s codegen for
# `async fn` methods (init_gpu, generate_gpu, debug_compare_gpu_cpu) needs
# it to turn a Rust Future into the JS Promise those methods return.
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

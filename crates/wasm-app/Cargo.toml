# Standalone crate (deliberately not a member of the root workspace — see
# the root Cargo.toml comment): this is the only crate that gets compiled
# to wasm32, via `wasm-pack build` (see README.md at the repo root for the
# full build command). Needs network access to fetch wasm-bindgen & co,
# and the wasm32-unknown-unknown target, neither of which is available in
# every sandbox this repo might be developed in — hence keeping it out of
# the default `cargo test` workspace so that stays offline-buildable.
[workspace]

[package]
name = "wasm-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
llm-core = { path = "../llm-core" }
wasm-bindgen = "0.2"
# For calling the JS token callback that streams generated text back to
# the page as it arrives.
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
# wasm-opt (Binaryen) crashed in CI with "Only 1 table definition allowed
# in MVP" - a known version mismatch between whatever wasm-opt binary
# wasm-pack has cached and the multi-table wasm this rustc/wasm-bindgen
# combination now emits, unrelated to this crate's own code. wasm-opt is
# a size optimization pass only, not required for correctness - disabling
# it trades a somewhat larger .wasm file for a build that doesn't
# intermittently fail on toolchain drift outside this project's control.
wasm-opt = false

# This crate is where llm-core's math actually runs for users, so the
# release profile is tuned for speed rather than for .wasm size: the inner
# loops in llm-core::ops are the whole cost of generating a token, and they
# need cross-crate inlining plus vectorization to be worth anything.
# (Note the *root* workspace uses opt-level = "z" — that profile does not
# apply here, since this crate is deliberately its own workspace.)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

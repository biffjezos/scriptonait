name: Pretrain the shipped model

# Where the model that ships with the site actually gets trained.
#
# Not in the browser: a tab gets one thread (wasm threads need
# cross-origin isolation, which Pages doesn't serve), it competes with
# the rest of the machine, and it loses everything when it's closed. A
# runner has four cores, native optimization flags, and six hours.
#
# Six hours is also the cap, and useful training is longer than that, so
# a run is one *round*: it resumes from the published checkpoint, trains
# for its budget, publishes the result, and — if asked for more rounds —
# dispatches the next one. Weights and step count travel in the release
# asset; Adam's moments travel in the Actions cache, because they're
# three times the size and only the next round wants them.
#
# Start it from the Actions tab. Nothing here runs on a push: training
# for hours on every commit would be absurd.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to train in this round
        default: "240"
      rounds:
        description: Rounds to run, including this one (each dispatches the next)
        default: "1"
      fresh:
        description: Start from a new random model instead of resuming
        type: boolean
        default: false
      total_steps:
        description: Steps the whole training plan is for (shapes the cosine decay)
        default: "60000"
      layers:
        description: Layers (fresh runs only)
        default: "6"
      hidden:
        description: Hidden size (fresh runs only)
        default: "320"
      lr:
        description: Peak learning rate
        default: "3e-4"

# `contents: write` is for publishing the checkpoint as a release asset.
permissions:
  contents: write
  actions: write

# One training round at a time. Two rounds resuming from the same
# checkpoint would each throw the other's work away.
concurrency:
  group: pretrain
  cancel-in-progress: false

env:
  MODEL_TAG: model-latest
  CHECKPOINT: model/scriptonait.ckpt
  WEB_CHECKPOINT: frontend/model/scriptonait.ckpt

jobs:
  train:
    runs-on: ubuntu-latest
    # Above the 240-minute default so a round has room to save and
    # publish after its training budget runs out.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache the downloaded corpus
        uses: actions/cache@v4
        with:
          path: corpus/raw
          # Keyed on the manifest: adding a work invalidates it, and
          # fetch.sh then only downloads what's missing anyway.
          key: corpus-raw-${{ hashFiles('corpus/manifest.tsv') }}

      - name: Fetch the corpus
        run: corpus/fetch.sh

      - name: Build the tokenizer and dataset
        # Cheap next to training (minutes), and rebuilding it every round
        # keeps it honestly in sync with the manifest and the code.
        run: cargo run --release -p llm-data -- --raw corpus/raw --out corpus/build

      - name: Download the published checkpoint
        if: ${{ inputs.fresh != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model
          if gh release download "$MODEL_TAG" --pattern 'scriptonait.f32.ckpt' --output "$CHECKPOINT"; then
            echo "resuming from the published checkpoint ($(wc -c < "$CHECKPOINT") bytes)"
          else
            echo "nothing published yet — this round starts from a fresh model"
          fi

      - name: Restore optimizer state
        if: ${{ inputs.fresh != true }}
        uses: actions/cache/restore@v4
        with:
          path: model/scriptonait.ckpt.opt
          # Exact key per run, restore-key by prefix: each round writes a
          # new entry and picks up the most recent previous one. A miss
          # is survivable — Adam rebuilds its moments in a few hundred
          # steps — so nothing here fails the job.
          key: optimizer-${{ github.run_id }}
          restore-keys: optimizer-

      - name: Train
        run: |
          cargo run --release -p llm-train -- \
            --data corpus/build \
            --out "$CHECKPOINT" \
            --web-out "$WEB_CHECKPOINT" \
            ${{ inputs.fresh == true && ' ' || format('--resume {0}', env.CHECKPOINT) }} \
            --minutes "${{ inputs.minutes }}" \
            --total-steps "${{ inputs.total_steps }}" \
            --lr "${{ inputs.lr }}" \
            --layers "${{ inputs.layers }}" \
            --hidden "${{ inputs.hidden }}" \
            --heads 8 --kv-heads 2 --context 512 --window 256 \
            --log-every 60 --save-every 900

      - name: Publish the checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two assets: the bf16 one the site downloads (half the bytes,
          # which matters when it's the thing standing between a visitor
          # and a working page), and the f32 one the next round resumes
          # from (so rounding doesn't accumulate across restarts).
          cp "$WEB_CHECKPOINT" scriptonait.ckpt
          cp "$CHECKPOINT" scriptonait.f32.ckpt
          gh release view "$MODEL_TAG" >/dev/null 2>&1 || \
            gh release create "$MODEL_TAG" --title "Latest pretrained model" \
              --notes "Published by the pretrain workflow. scriptonait.ckpt is bf16 and is what the site serves; scriptonait.f32.ckpt is full precision and is what the next training round resumes from."
          gh release upload "$MODEL_TAG" scriptonait.ckpt scriptonait.f32.ckpt --clobber
          echo "published $(wc -c < scriptonait.ckpt) bytes (bf16) and $(wc -c < scriptonait.f32.ckpt) bytes (f32)"

      - name: Save optimizer state
        uses: actions/cache/save@v4
        with:
          path: model/scriptonait.ckpt.opt
          key: optimizer-${{ github.run_id }}

      - name: Redeploy the site with the new model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}" || echo "deploy workflow not dispatchable from this branch"

      - name: Dispatch the next round
        if: ${{ inputs.rounds != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Decrement and re-dispatch. The counter is what stops this
          # being an infinite loop: there is no other exit condition.
          remaining=$(( ${{ inputs.rounds }} - 1 ))
          if [ "$remaining" -lt 1 ]; then exit 0; fi
          echo "dispatching $remaining more round(s)"
          gh workflow run pretrain.yml --ref "${{ github.ref_name }}" \
            -f minutes="${{ inputs.minutes }}" \
            -f rounds="$remaining" \
            -f fresh=false \
            -f total_steps="${{ inputs.total_steps }}" \
            -f lr="${{ inputs.lr }}"

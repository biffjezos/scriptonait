name: Build and deploy to GitHub Pages

# This is where the actual Rust -> wasm build happens, and it is the
# only place it happens. The browser downloads a compiled .wasm file and
# instantiates it; nothing is compiled client-side, and there is no
# toolchain on the page. `frontend/pkg/` is generated here and
# deliberately not in git (see .gitignore).
#
# The site ships no model. The page never fetches one — you train your
# own in the browser, or open a file you saved earlier.
#
# It has to run here rather than in this project's development sandbox,
# which has no route to crates.io, npmjs.org, or the wasm32 target
# installer — so this workflow is also the only compiler llm-gpu and
# wasm-app ever see, which is why every push runs the build job.

on:
  # Every push runs the `build` job (compile + test), regardless of
  # branch - that's the fast CI-compile-check signal for a crate
  # (wasm-app) this repo's dev sandbox has no way to build itself. Actual Pages deployment (the `deploy` job) is additionally
  # gated to dev/main/master only, so a work-in-progress branch gets
  # build validation without deploying to the live site.
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/llm-core
            crates/llm-gpu
            crates/wasm-app
            crates/shader-check

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Check the format strings
        # llm-gpu and wasm-app need crates.io, which the development
        # sandbox has no route to, so they compile for the first time
        # here. A missing backslash in a JSON format string is then a
        # failed deploy ten minutes after a push, over something a
        # one-second scan catches. This runs before the build for
        # exactly that reason.
        run: python3 tools/check-format-strings.py

      - name: Parse the frontend as ES modules
        # A worker that does not parse installs no message handler: the
        # page then hangs on every call with no error and no log. Node
        # parses each file as a module here so that never ships.
        run: |
          for f in frontend/app.js frontend/worker.js frontend/db.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Test the engine
        run: cargo test

      - name: Compile every WGSL shader
        # llm-gpu embeds its shaders with include_str! and only compiles
        # them at create_shader_module time — in a browser, when the page
        # first reaches for the GPU. Nothing in the Rust build looks at
        # them, so naga (wgpu's own WGSL front end) checks them here
        # instead of letting a typo reach a user's screen.
        run: cargo test --manifest-path crates/shader-check/Cargo.toml

      - name: Build wasm-app -> frontend/pkg
        # +simd128 is what lets LLVM turn llm-core's dot/axpy inner loops
        # into real wasm SIMD instead of scalar float ops — a large,
        # measurable difference to how fast text appears on the page.
        # WebAssembly SIMD has been baseline in Chrome/Edge/Firefox/Safari
        # since 2023.
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: wasm-pack build crates/wasm-app --release --target web --out-dir ../../frontend/pkg

      - name: Take over Pages from the built-in branch deployment
        # Without this, GitHub keeps Pages on its default "deploy from a
        # branch" source and runs its own `pages-build-deployment`
        # workflow on every push — so two pipelines publish the same
        # site and whichever lands second wins.
        #
        # That is not merely untidy. The branch-based one publishes the
        # repository as it exists in git, and `frontend/pkg/` is not in
        # git: it is generated by the build job above. When it wins the
        # race the site serves a page whose .wasm 404s, which looks
        # exactly like "I deployed and nothing changed".
        #
        # `enablement: true` switches the source to this workflow, which
        # stops the built-in one from running at all.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy to GitHub Pages

# This is where the actual Rust -> wasm build happens. It has to run here
# (a GitHub Actions runner, with normal internet access) rather than in
# the sandbox this project was originally developed in, which had no
# route to crates.io, npmjs.org, or the wasm32 target installer at all.

on:
  push:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/llm-core
            crates/llm-gpu
            crates/wasm-app

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Test llm-core (the verified CPU reference engine)
        run: cargo test -p llm-core

      - name: Build wasm-app -> frontend/pkg
        run: wasm-pack build crates/wasm-app --release --target web --out-dir ../../frontend/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
